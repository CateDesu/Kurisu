[package]
name = "kurisu-native"
version = "1.0.0"
description = "Kurisu native anime tracking program"
authors = ["CateDesu"]
license = "MIT"
edition = "2024"
publish = false

[features]
default = []
fixture-runtime = ["kurisu-core/test-support"]

[dependencies]
kurisu-core = { path = "../core" }
gpui = { package = "gpui-unofficial", version = "=1.27.0" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.27.0", features = ["wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
directories = "5"
unicode-segmentation = "=1.13.3"
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
sys-locale = "=0.3.2"
open = "5"
log = "0.4"
same-file = "1.0.6"
env_logger = "0.11"
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "=1.27.0", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common-0.19.1" }
gpui-unofficial = { path = "vendor/gpui-unofficial-1.27.0" }
gpui-linux-gpui-unofficial = { path = "vendor/gpui-linux-gpui-unofficial-1.27.0" }
gpui-windows-gpui-unofficial = { path = "vendor/gpui-windows-gpui-unofficial-1.27.0" }

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
