name: Native checks and packaging

on:
  workflow_dispatch:
    inputs:
      build-version:
        description: Build stamp, empty discovers latest stable
        type: string
        default: ''
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      build-version:
        type: string
        default: ''
    outputs:
      linux-artifact-id:
        value: ${{ jobs.build.outputs.linux-artifact-id }}
      windows-artifact-id:
        value: ${{ jobs.build.outputs.windows-artifact-id }}
  pull_request:
    paths:
      - 'core/**'
      - 'native/**'
      - 'LICENSE'
      - '.node-version'
      - '.github/workflows/native-candidate.yml'
      - '.github/workflows/native-release.yml'
      - '.github/native-release*.mjs'
      - '.github/prune-native-releases*.mjs'
      - '.github/test-native-installer.ps1'

env:
  CARGO_BUILD_JOBS: 3
  KURISU_BUILD_VERSION: ${{ inputs.build-version }}

permissions:
  actions: read
  contents: read

concurrency:
  group: native-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require explicit source commit for release calls
        if: ${{ !startsWith(github.workflow_ref, format('{0}/.github/workflows/native-candidate.yml@', github.repository)) }}
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release workflow call requires a full source-ref commit" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Record checked-out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-source
    outputs:
      linux-artifact-id: ${{ runner.os == 'Linux' && steps.upload.outputs.artifact-id || '' }}
      windows-artifact-id: ${{ runner.os == 'Windows' && steps.upload.outputs.artifact-id || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libvulkan-dev mpv dbus-daemon

      - name: Install Windows test and packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mpv nsis --no-progress -y

      - name: Report Rust toolchain
        run: rustc -Vv

      - name: Check core formatting
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Check native formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Release protocol regressions
        run: node --test .github/native-release.test.mjs .github/prune-native-releases.test.mjs

      - name: Core regressions
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Build version regression tests
        run: python -m unittest discover -s native -p test_build.py

      - name: Compile native regressions
        timeout-minutes: 30
        run: cargo test --locked --manifest-path native/Cargo.toml --features fixture-runtime --no-run

      - name: Native regressions
        timeout-minutes: 5
        run: cargo test --locked --manifest-path native/Cargo.toml --features fixture-runtime -- --test-threads=1 --nocapture

      - name: Linux accessibility adapter regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path native/Cargo.toml -p accesskit_atspi_common --lib

      - name: Windows window zoom regressions
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path native/Cargo.toml -p gpui-windows-gpui-unofficial --lib window::tests::test_zoom_toggle_helpers -- --exact

      - name: Core Clippy
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Native Clippy
        run: cargo clippy --locked --manifest-path native/Cargo.toml --features fixture-runtime --all-targets -- -D warnings

      - name: Build Linux candidate
        if: runner.os == 'Linux'
        run: python native/build.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Windows candidate and installer
        if: runner.os == 'Windows'
        run: python native/build.py --installer
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Inspect Linux runtime dependencies
        if: runner.os == 'Linux'
        run: ldd native/target/release/kurisu-native

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: kurisu-native-${{ runner.os }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            native/target/release/kurisu-native
            native/target/release/kurisu-native.exe
            native/target/release/kurisu-native.sha256
            native/target/release/kurisu-native.exe.sha256
            native/target/release/LICENSE
            native/target/release/THIRD_PARTY_NOTICES.txt
            native/target/release/bundle/Kurisu-Native_*.exe
            native/target/release/bundle/Kurisu-Native_*.exe.sha256
            native/target/release/bundle/Kurisu_*_linux-x64.tar.gz
            native/target/release/bundle/Kurisu_*_linux-x64.tar.gz.sha256

  verify-windows-installer:
    needs: [resolve-source, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.windows-artifact-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: native/target/release

      - name: Verify Windows installer in disposable runner
        shell: pwsh
        run: .github/test-native-installer.ps1
