# Main pushes publish v<base>.<commit_count>. Tags publish named releases.
# Keep releases as drafts until both platforms finish. Clean orphan drafts manually.
name: Release build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Frontend typecheck
        run: npm run check

  meta:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
      rolling: ${{ steps.v.outputs.rolling }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manual runs only from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::manual runs are only allowed from main (this ref: $REF)"
            exit 1
          fi

      # Commit counts survive workflow renames. Run numbers reset and can regress versions.
      # Pass ref names through env to prevent shell injection.
      - id: v
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            ROLL=false
          else
            BASE=$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
            if [ -z "$BASE" ]; then echo "::error::no version in tauri.conf.json"; exit 1; fi
            TAG="v${BASE}.$(git rev-list --count HEAD)"
            ROLL=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLL" >> "$GITHUB_OUTPUT"
          echo "Building tag=$TAG rolling=$ROLL"

      - name: Refuse to regress the rolling channel
        if: steps.v.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          LATEST=$(gh release list -R "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "No published rolling release yet; $TAG is the first"
          elif [ "$TAG" = "$LATEST" ] || [ "$(printf '%s\n%s\n' "${TAG#v}" "${LATEST#v}" | sort -V | tail -1)" != "${TAG#v}" ]; then
            echo "::error::$TAG is not newer than the current latest rolling release $LATEST; refusing to regress the channel (re-run of an old run?)"
            exit 1
          else
            echo "$TAG sorts above current latest $LATEST"
          fi

      - name: Create the release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Only overwrite draft assets. A failed rerun must not damage a published release.
          if STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$STATE" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to overwrite its assets." \
                   "Bump the version (or delete the release) instead of re-running this build."
              exit 1
            fi
            echo "Reusing existing draft $TAG"
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --generate-notes --draft
          fi

  build-windows:
    needs: meta
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx tauri build --bundles nsis
        env:
          KURISU_BUILD_VERSION: ${{ needs.meta.outputs.ver }}

      - uses: actions/upload-artifact@v4
        with:
          name: kurisu-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/kurisu.exe

      - name: Write SHA-256 sidecar
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Write SHA-256 sidecar for the bare exe
        working-directory: src-tauri/target/release
        shell: bash
        run: sha256sum kurisu.exe > kurisu.exe.sha256

      # Upload without editing the draft flag. The publish job owns that transition.
      - name: Upload Windows build to release
        shell: bash
        run: |
          gh release upload "${{ needs.meta.outputs.tag }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.exe.sha256 \
            src-tauri/target/release/kurisu.exe \
            src-tauri/target/release/kurisu.exe.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: meta
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build
        run: npx tauri build --no-bundle
        env:
          KURISU_BUILD_VERSION: ${{ needs.meta.outputs.ver }}

      # The Linux updater requires the asset name kurisu.
      - name: Write SHA-256 sidecar
        working-directory: src-tauri/target/release
        run: sha256sum kurisu > kurisu.sha256

      - name: Upload Linux binary to release
        working-directory: src-tauri/target/release
        run: gh release upload "${{ needs.meta.outputs.tag }}" kurisu kurisu.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release edit -R "${{ github.repository }}" "$TAG" --draft=false
          echo "Published $TAG"

  # Prune only older rolling tags after publication. Keep named releases and drafts.
  prune-rolling:
    needs: [meta, publish]
    if: needs.meta.outputs.rolling == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete superseded rolling releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ needs.meta.outputs.tag }}
        run: |
          gh release list -R "${{ github.repository }}" --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease | not) | select(.isDraft | not) | .tagName' | while read -r t; do
            [ -z "$t" ] && continue
            [ "$t" = "$KEEP" ] && continue
            echo "$t" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || continue
            if [ "$(printf '%s\n%s\n' "${t#v}" "${KEEP#v}" | sort -V | tail -1)" != "${KEEP#v}" ]; then
              echo "Keeping $t: newer than $KEEP"
              continue
            fi
            echo "Pruning superseded rolling release $t"
            gh release delete -R "${{ github.repository }}" "$t" --cleanup-tag --yes || true
          done
