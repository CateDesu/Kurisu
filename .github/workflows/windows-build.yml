name: Final Tauri bridge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable final bridge source tag
        required: true
        default: v1.0.0.78
      publish:
        description: Publish after both platform builds pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 3

concurrency:
  group: kurisu-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.plan.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/release-transition.mjs plan bridge "$RELEASE_TAG"

  test:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev mpv dbus-daemon

      - run: npm ci

      - name: Core tests
        working-directory: core
        run: cargo test --locked

      - name: Legacy adapter tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build frontend for optimized tests
        run: npm run build

      - name: Optimized GLib regression
        working-directory: src-tauri
        run: cargo test --locked --release --test glib_variant_iter

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Core Clippy
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend regression tests
        run: npm test

      - name: Release protocol tests
        run: node --test .github/release-version.test.mjs .github/release-transition.test.mjs

  build:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build frozen bridge
        shell: bash
        env:
          KURISU_BUILD_VERSION: ${{ needs.plan.outputs.ver }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx tauri build --bundles nsis
          else
            npx tauri build --no-bundle
          fi
      - name: Stage original legacy assets and existing sidecars
        shell: bash
        run: |
          mkdir bridge-assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/kurisu.exe src-tauri/target/release/bundle/nsis/*.exe bridge-assets/
          else
            cp src-tauri/target/release/kurisu bridge-assets/
          fi
          cd bridge-assets
          for artifact in *; do sha256sum "$artifact" > "$artifact.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ runner.os }}
          path: bridge-assets/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          merge-multiple: true
          path: release-assets
      - name: Publish immutable bridge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/release-transition.mjs publish bridge "$RELEASE_TAG" release-assets
