# Set the DISCORD_WEBHOOK repository secret to the destination webhook URL.
name: Discord notify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post push to Discord
        env:
          # Pass commit text through env to prevent shell injection.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set — skipping."
            exit 0
          fi
          jq -nc --arg c "📦 Push to **${REPO}** by ${ACTOR}

          ${COMMIT_MSG}
          ${COMMIT_URL}" '{content:$c, username:"Kurisu"}' \
            | curl -sSf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" || true
