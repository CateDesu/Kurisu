[package]
name = "kurisu"
version = "1.0.0"
description = "An anime tracking program for Linux and Windows with AniList sync"
authors = ["CateDesu"]
license = "MIT"
edition = "2021"

[lib]
name = "kurisu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# system-proxy keeps AniList and update requests working on managed networks.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
ring = "0.17"
sha2 = "0.10"
quick-xml = "0.37"
discord-rich-presence = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
] }
